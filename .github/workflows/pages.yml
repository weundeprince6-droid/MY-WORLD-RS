# Publie le site (dossier public) sur GitHub Pages : https://weundeprince6-droid.github.io/MY-WORLD-RS/
# Activation unique : GitHub > Settings > Pages > Source : « GitHub Actions ».
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Vérifier la syntaxe JavaScript
        run: |
          node --check public/app.js
          node --input-type=commonjs --check < functions/index.js
      - name: Tester les modules de l’application
        run: npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploiement
        uses: actions/deploy-pages@v4

<head>
<meta charset="utf-8">

<title>WEBSERVICES ACADEMY · Espace pédagogique</title>
<style>
:root{--bg:#0b1220;--carte:#131c2e;--carte2:#1a2540;--bord:#27344f;--txt:#e8ecf4;--doux:#9aa7c0;--or:#f5b942;--ok:#3ecf8e;--mal:#ff6b6b;--bleu:#5aa2ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bleu)}
.haut{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#08101d;border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:5}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--or);color:#1a1200;font-weight:800}
.haut h1{margin:0;font-size:17px;line-height:1.1}.haut small{color:var(--doux)}
.espace{flex:1}
.moi{text-align:right;font-size:13px}.moi b{display:block}
.pose{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 63px)}
nav{padding:14px 10px;border-right:1px solid var(--bord);display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--doux)}
nav button:hover{background:var(--carte)}nav button.actif{background:var(--carte2);color:var(--or);font-weight:600}
main{padding:20px;max-width:1000px;width:100%}
h2{margin:0 0 4px;font-size:22px}.sous{color:var(--doux);margin:0 0 18px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:16px;margin-bottom:14px}
.carte h3{margin:0 0 4px;font-size:16px}.meta{color:var(--doux);font-size:13px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne .espace{flex:1}
.btn{border:1px solid var(--bord);background:var(--carte2);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--or)}.btn.pri{background:var(--or);color:#1a1200;border-color:var(--or);font-weight:700}
.btn.mal{color:var(--mal)}.btn.petit{padding:4px 10px;font-size:13px}
.puce{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bord);color:var(--doux)}
.puce.ok{color:var(--ok);border-color:var(--ok)}.puce.mal{color:var(--mal);border-color:var(--mal)}.puce.or{color:var(--or);border-color:var(--or)}
form.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--doux)}label.large{grid-column:1/-1}
input,select,textarea{background:#0d1526;border:1px solid var(--bord);border-radius:9px;padding:9px 10px;color:var(--txt);width:100%}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bord);text-align:left;vertical-align:top}th{color:var(--doux);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.vide{color:var(--doux);padding:18px;text-align:center}
.erreur{color:var(--mal);margin:8px 0}.info{color:var(--ok);margin:8px 0}
.connexion{max-width:400px;margin:8vh auto;padding:0 18px}
dialog{background:var(--carte);color:var(--txt);border:1px solid var(--bord);border-radius:16px;padding:20px;width:min(680px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
.q{margin:14px 0}.q p{margin:0 0 6px;font-weight:600}.q label{flex-direction:row;align-items:center;color:var(--txt);gap:8px;padding:4px 0}.q input{width:auto}
.jour{margin-top:14px;color:var(--or);font-weight:700}
.rond{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--doux)}

.brevet-selection{margin-top:14px}.brevet-wizard{margin-top:14px;background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:18px;box-shadow:0 12px 34px #0000000c}
.brevet-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.brevet-tab{display:flex;align-items:center;gap:9px;text-align:left;padding:12px 10px;border:1px solid var(--bord);border-radius:12px;background:transparent;color:var(--txt);font:600 12px Arial,sans-serif;cursor:pointer;min-height:56px}
.brevet-tab span{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:9px;background:var(--fond);color:var(--doux);font-size:11px}
.brevet-tab.active{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 9%,var(--carte));color:var(--txt)}
.brevet-tab.active span,.brevet-tab.complete span{background:var(--bleu);color:white}
.brevet-panel{padding:4px 2px 16px}.brevet-panel h3{font-size:19px;margin:0 0 5px}.brevet-panel>.meta{margin:0 0 18px}
.brevet-champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.brevet-champs label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:650;color:var(--txt)}
.brevet-champs input,.brevet-champs select{width:100%;min-height:44px;border:1px solid var(--bord);border-radius:10px;padding:10px 12px;background:var(--fond);color:var(--txt);font:inherit}
.brevet-champs .champ-photo{grid-column:1/-1;padding:16px;border:1px dashed var(--bleu);border-radius:12px;background:color-mix(in srgb,var(--bleu) 5%,var(--carte))}
.brevet-navigation{display:flex;align-items:center;gap:9px;border-top:1px solid var(--bord);padding-top:15px;margin-top:10px}.etape-compteur{margin-right:auto;color:var(--doux);font-size:12px;font-weight:700}.brevet-erreur{color:var(--mal);font-size:13px;min-height:20px;margin:6px 0}
.ecran-brevet{position:fixed;inset:0;z-index:50;background:#0b1220f2;overflow:auto;padding:18px}
.ecran-brevet .barre{display:flex;align-items:center;justify-content:flex-end;gap:10px;max-width:1180px;margin:0 auto 14px}
.barre-titre{margin-right:auto;color:#fff;display:flex;flex-direction:column;gap:3px}.barre-titre b{font-size:15px}.barre-titre span{font-size:11px;color:#b6c2d3}

.brevet{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;width:min(1180px,100%);min-height:790px;margin:0 auto;background:#fff;color:#18263b;border:7px double #17365b;outline:1px solid #c7a45b;outline-offset:-14px;box-shadow:0 22px 70px #0007;overflow:hidden;font-family:Georgia,"Times New Roman",serif;position:relative}
.brevet:before{content:"";position:absolute;top:0;left:0;right:0;height:8px;background:linear-gradient(90deg,#0072bc 0 33.33%,#ce2028 33.33% 66.66%,#f7d417 66.66% 100%)}
.brevet-aside{background:#f7f8fb;color:#17365b;padding:27px 52px 20px;display:grid;grid-template-columns:105px 1fr 150px;grid-template-rows:auto auto;align-items:center;gap:5px 22px;text-align:center;border-bottom:3px solid #c7a45b}
.monogramme{grid-column:1;grid-row:1/3;width:78px;height:78px;border:2px solid #c7a45b;border-radius:50%;display:grid;place-items:center;color:#17365b;font:700 25px Georgia,serif;letter-spacing:2px;margin:0 auto}
.aside-label{grid-column:2;grid-row:1;font-size:13px;letter-spacing:3px;line-height:1.7;color:#17365b}.aside-label b{display:block;color:#17365b;font-size:23px;letter-spacing:4px}
.photo-candidat{grid-column:3;grid-row:1/3;width:112px;height:132px;object-fit:cover;background:#e8edf2;border:4px solid #fff;outline:1px solid #c7a45b;margin:0 auto;box-shadow:0 3px 12px #0002}
.photo-vide{grid-column:3;grid-row:1/3;width:112px;height:132px;display:grid;place-items:center;background:#edf1f6;border:1px dashed #9aa8b9;color:#64748b;font:11px Arial,sans-serif;letter-spacing:1px;margin:0 auto}
.aside-num{grid-column:2;grid-row:2;margin:0;padding:5px 12px;border-top:1px solid #cbd3df;width:auto;font:11px Arial,sans-serif;letter-spacing:2px;color:#64748b}.aside-num b{display:inline-block;color:#17365b;font:700 14px monospace;margin-left:8px;overflow-wrap:anywhere}.aside-type{display:none}
.brevet-main{padding:28px 70px 30px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.sur-titre{font:700 11px Arial,sans-serif;letter-spacing:3px;color:#8d6b27;text-transform:uppercase}
.brevet-main h1{font:700 31px Georgia,serif;letter-spacing:2px;color:#17365b;margin:12px 0 8px;text-transform:uppercase}
.trait-or{height:3px;width:115px;background:#c7a45b;margin-bottom:18px}
.certifie{font:16px Georgia,serif;color:#596579;margin:0 0 8px}
.nom-candidat{font:700 29px Georgia,serif;color:#17365b;margin:5px 0 7px;text-transform:uppercase;letter-spacing:1.5px;border-bottom:1px dotted #9ba8b8;padding:0 22px 7px}
.naissance{font:12px Arial,sans-serif;color:#6f7d8e;margin:0 0 20px}
.details-formation{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:9px;text-align:left;margin:0 0 13px}
.details-formation>div{padding:11px 14px;background:#f7f8fa;border:1px solid #e0e5ec;border-left:3px solid #c5a45b;min-height:58px}.details-formation>div:first-child{grid-column:1/-1}
.details-formation span,.resultat span{display:block;font:700 9px Arial,sans-serif;letter-spacing:1.4px;color:#7c8795;margin-bottom:6px}.details-formation b{font:700 13px Arial,sans-serif;color:#1b3049}
.resultat{display:grid;grid-template-columns:1fr 1fr;width:100%;border:1px solid #cbd3df;margin:2px 0 12px}.resultat>div{padding:10px}.resultat>div+div{border-left:1px solid #cbd3df}.resultat b{font:700 18px Georgia,serif;color:#9a7832}
.formule{font:italic 12px Georgia,serif;color:#667386;line-height:1.6;margin:0 0 8px}.delivrance{font:700 12px Arial,sans-serif;color:#293c54;margin:5px 0 17px}
.signatures{display:grid;grid-template-columns:1fr 1fr;gap:65px;width:100%;margin-top:auto}.signature-bloc{display:flex;flex-direction:column;align-items:center;gap:7px;padding-top:10px;border-top:1px solid #253a52}
.signature-bloc span{font:700 9px Arial,sans-serif;letter-spacing:1px;color:#5f6e80}.signature-bloc b{font:700 14px Georgia,serif;color:#192d46;min-height:18px}.signature-bloc i{font:10px Arial,sans-serif;color:#8792a0}.signature-bloc.jury{border-color:#c6a45b}
.pied-brevet{font:8px Arial,sans-serif;letter-spacing:1.5px;color:#9aa4b1;margin-top:20px}
@media print{@page{size:A4 landscape;margin:0}html,body{background:#fff!important;margin:0!important;padding:0!important}body>*:not(#zone-brevet){display:none!important}#zone-brevet{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}.ecran-brevet .barre{display:none!important}.brevet{width:297mm;height:210mm;min-height:210mm;margin:0;border-radius:0;box-shadow:none;break-inside:avoid;print-color-adjust:exact;-webkit-print-color-adjust:exact}.brevet-aside{padding:8mm 15mm 5mm}.brevet-main{padding:7mm 18mm 7mm}.photo-candidat,.photo-vide{width:30mm;height:35mm}.details-formation>div{min-height:13mm}}
@media(max-width:760px){.pose{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--bord)}nav button{white-space:nowrap}main{padding:14px}}

input,select,textarea{min-height:42px;background:#0c1628;border-color:#30415e}

/* Thèmes dynamiques : système / clair / sombre */
:root{
  color-scheme:dark;
  --bg:#080d12;--carte:#101a19;--carte2:#172925;--bord:#29453c;
  --txt:#edf7f1;--doux:#a5b9ae;--or:#35c987;--ok:#35c987;
  --mal:#ff7777;--bleu:#4d9fff;--fond:#0b1712;
  --entete:#07130e;--nav:#08150f;--surface-alt:#14251e;
  --carte-debut:#12221b;--carte-fin:#0d1915;--champ:#0b1712;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f7f4;--carte:#ffffff;--carte2:#e5f3eb;--bord:#c9ded1;
  --txt:#172820;--doux:#5e7468;--or:#138653;--ok:#138653;
  --mal:#c83d4d;--bleu:#176fc1;--fond:#f7fbf8;
  --entete:#ffffff;--nav:#edf5f0;--surface-alt:#e4f1e9;
  --carte-debut:#ffffff;--carte-fin:#f5faf7;--champ:#ffffff;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    color-scheme:light;
    --bg:#f2f7f4;--carte:#ffffff;--carte2:#e5f3eb;--bord:#c9ded1;
    --txt:#172820;--doux:#5e7468;--or:#138653;--ok:#138653;
    --mal:#c83d4d;--bleu:#176fc1;--fond:#f7fbf8;
    --entete:#ffffff;--nav:#edf5f0;--surface-alt:#e4f1e9;
    --carte-debut:#ffffff;--carte-fin:#f5faf7;--champ:#ffffff;
  }
}
body{background:radial-gradient(ellipse at 12% -10%,color-mix(in srgb,var(--ok) 13%,transparent) 0,transparent 40%),var(--bg);color:var(--txt)}
.haut{background:var(--entete);border-bottom-color:var(--bord)}
.haut .meta,.moi .meta{color:var(--doux)}
.moi b{color:var(--txt)}
nav{background:var(--nav);border-color:var(--bord)}
nav button{color:var(--doux)}
nav button:hover{background:var(--surface-alt);border-color:var(--bord)}
nav button.actif{background:var(--carte2);border-color:var(--ok);color:var(--ok);box-shadow:inset 3px 0 var(--ok)}
.carte,.brevet-wizard{background:linear-gradient(145deg,var(--carte-debut),var(--carte-fin));border-color:var(--bord);color:var(--txt)}
.meta,.sous,.vide,th{color:var(--doux)}
.btn{background:var(--carte2);border-color:var(--bord);color:var(--txt)}
.btn:hover{border-color:var(--ok)}
.btn.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 75%,white),var(--ok));color:#062016;border-color:var(--ok)}
input,select,textarea,.brevet-champs input,.brevet-champs select{background:var(--champ);border-color:var(--bord);color:var(--txt)}
input::placeholder,textarea::placeholder{color:var(--doux)}
input:focus,select:focus,textarea:focus,:focus-visible{outline-color:var(--ok);border-color:var(--ok)}
th,td{border-bottom-color:var(--bord)}
.puce{border-color:var(--bord);color:var(--doux)}
.brevet-tab{background:var(--champ);border-color:var(--bord);color:var(--txt)}
.brevet-tab.active{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 10%,var(--carte))}
.brevet-navigation{background:color-mix(in srgb,var(--carte) 94%,transparent)}
.theme-toggle{white-space:nowrap;font-weight:750;border-color:var(--ok);color:var(--ok);min-width:94px}
.ecran-brevet{background:color-mix(in srgb,var(--bg) 94%,transparent)}
/* Le diplôme imprimé conserve volontairement son papier blanc et ses couleurs officielles. */
@media(max-width:600px){.theme-toggle{min-width:0;padding:6px 8px;font-size:10px}}


/* Graphiques du tableau de bord Academy */
.graph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px;margin:12px 0}
.academy-graph{min-width:0;overflow:hidden}
.graph-bars{height:190px;display:flex;align-items:flex-end;gap:clamp(5px,2vw,14px);padding:18px 8px 4px;border-bottom:1px solid var(--bord);overflow-x:auto}
.graph-col{flex:1 0 28px;min-width:28px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.graph-value{font-size:11px;color:var(--txt);white-space:nowrap}
.graph-track{height:125px;width:min(100%,34px);display:flex;align-items:flex-end;background:var(--surface-alt);border-radius:8px 8px 3px 3px;overflow:hidden}
.graph-fill{width:100%;min-height:0;border-radius:7px 7px 2px 2px;transition:height .25s ease}
.graph-label{font-size:11px;color:var(--doux);max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</style>

<body>
<div id="app"><p class="vide">Chargement…</p></div>
<dialog id="dlg"></dialog>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, reglages } from "./config.js";

const DIRECTION_EMAIL = String(reglages.allowedGoogleEmail || "").toLowerCase();
const ROLES = { direction: "Direction", enseignant: "Enseignant", eleve: "Élève", comptable: "Comptable", secretaire: "Secrétaire" };
const STAFF = ["direction", "enseignant", "secretaire", "comptable"];

// Application nommée : la session de la classe reste séparée de celle de MY WORLD RS.
const app = initializeApp(firebaseConfig, "classroom");
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- petits outils ----------
const $app = document.getElementById("app");
const dlg = document.getElementById("dlg");

// Thèmes indépendants de MY WORLD RS : système, clair et sombre.
const THEME_KEY = "webservices-academy-theme";
const THEMES = ["system", "light", "dark"];
let academyTheme = (() => { try { const v = localStorage.getItem(THEME_KEY); return THEMES.includes(v) ? v : "system"; } catch { return "system"; } })();
function applyTheme() { document.documentElement.dataset.theme = academyTheme; }
function themeLabel() { return academyTheme === "system" ? "◐ Système" : academyTheme === "light" ? "☀ Clair" : "☾ Sombre"; }
function cycleTheme() {
  academyTheme = THEMES[(THEMES.indexOf(academyTheme) + 1) % THEMES.length];
  try { localStorage.setItem(THEME_KEY, academyTheme); } catch {}
  applyTheme();
  const b = document.querySelector(".theme-toggle");
  if (b) { b.textContent = themeLabel(); b.title = "Changer de thème"; }
}
applyTheme();
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const aujourdhui = () => { const d = new Date(); const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return local.toISOString().slice(0, 10); };
const fmtDate = (d) => { if (!d) return ""; const x = new Date(String(d).length <= 10 ? d + "T12:00:00" : d); return isNaN(x) ? String(d) : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); };
const nombre = (v) => Number(String(v).replace(",", "."));
const norm = (s) => String(s || "").trim().toLowerCase();
const tri = (arr, f, desc) => arr.slice().sort((a, b) => (String(f(a)) < String(f(b)) ? -1 : String(f(a)) > String(f(b)) ? 1 : 0) * (desc ? -1 : 1));
const sans = (o) => { const c = { ...o }; delete c.id; return c; };
const aide = (t) => h("p", { class: "meta" }, t);

const monter = (el, ...items) => el.replaceChildren(...items.flat(Infinity).filter((x) => x != null && x !== false));
function fermer() { if (dlg.open) dlg.close(); }
function modal(titre, ...contenu) {
  monter(dlg, h("div", { class: "ligne" }, h("h2", { style: "font-size:19px" }, titre), h("span", { class: "espace" }), h("button", { class: "btn petit", onclick: fermer, type: "button" }, "Fermer")), contenu);
  if (!dlg.open) dlg.showModal();
}

async function lister(nom, ...contraintes) {
  const s = await getDocs(contraintes.length ? query(collection(db, nom), ...contraintes) : collection(db, nom));
  return s.docs.map((d) => ({ id: d.id, ...d.data() }));
}

// Formulaire généré : champs = [{n, label, type, options, req, val, large, liste}]
async function photoCompressee(file) {
  if (!file) return "";
  if (!file.type || !file.type.startsWith("image/")) throw new Error("Choisissez un fichier image valide.");
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      try { const maxW = 420, maxH = 520, scale = Math.min(maxW / img.width, maxH / img.height, 1); const w = Math.max(1, Math.round(img.width * scale)), hgt = Math.max(1, Math.round(img.height * scale)); const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = hgt; canvas.getContext("2d").drawImage(img, 0, 0, w, hgt); URL.revokeObjectURL(url); resolve(canvas.toDataURL("image/jpeg", .72)); }
      catch (e) { URL.revokeObjectURL(url); reject(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Impossible de lire cette photo.")); }; img.src = url;
  });
}
function formulaire(champs, enregistrer, libelle = "Enregistrer") {
  const f = h("form", { class: "champs" });
  const msg = h("div", { class: "erreur", role: "alert", style: "grid-column:1/-1" });
  for (const c of champs) {
    let ctl;
    if (c.type === "textarea") ctl = h("textarea", { name: c.n, required: c.req, placeholder: c.ph || "" });
    else if (c.type === "file") ctl = h("input", { name: c.n, type: "file", accept: c.accept || "image/*", required: c.req });
    else if (c.type === "select") ctl = h("select", { name: c.n, required: c.req }, c.options.map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return h("option", { value: v }, l); }));
    else ctl = h("input", { name: c.n, type: c.type || "text", required: c.req, placeholder: c.ph || "", list: c.liste, step: c.type === "number" ? "any" : null, autocomplete: c.type === "password" ? "new-password" : "off" });
    if (c.val != null) ctl.value = c.val;
    f.append(h("label", { class: c.large || c.type === "textarea" ? "large" : "" }, c.label + (c.req ? " *" : ""), ctl));
  }
  const bouton = h("button", { class: "btn pri", type: "submit" }, libelle);
  f.append(msg, h("div", { style: "grid-column:1/-1" }, bouton));
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault(); msg.textContent = ""; bouton.disabled = true;
    try { const data = {}; for (const c of champs) data[c.n] = c.type === "file" ? await photoCompressee(f.elements[c.n].files[0]) : f.elements[c.n].value.trim(); await enregistrer(data, f); }
    catch (e) { msg.textContent = erreurTexte(e); }
    finally { bouton.disabled = false; }
  });
  return f;
}
function erreurTexte(e) {
  const c = e && e.code || "";
  if (c === "permission-denied" || /permission/i.test(e && e.message || "")) return "Accès refusé : vos droits ne permettent pas cette action (ou les règles Firestore ne sont pas encore publiées).";
  const m = { "auth/invalid-credential": "Email ou mot de passe incorrect.", "auth/wrong-password": "Email ou mot de passe incorrect.", "auth/user-not-found": "Email ou mot de passe incorrect.", "auth/invalid-email": "Adresse email invalide.", "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.", "auth/email-already-in-use": "Cet email a déjà un compte.", "auth/weak-password": "Mot de passe trop court (6 caractères minimum).", "auth/operation-not-allowed": "La connexion par email n'est pas activée dans Firebase (Authentication → Sign-in method).", "auth/popup-closed-by-user": "Fenêtre de connexion fermée.", "auth/network-request-failed": "Pas de connexion internet." };
  return m[c] || (e && e.message) || "Erreur inattendue.";
}

// ---------- état ----------
let moi = null; // { uid, nom, email, role, classe }
let vueCourante = "accueil";
const estStaff = () => STAFF.includes(moi.role);
const peut = (...roles) => roles.includes(moi.role);
const visible = (x) => { if (estStaff()) return true; const c = norm(x.classe); return !c || c === "toutes" || c === norm(moi.classe); };
let cacheEleves = null;
async function eleves(force) { if (!cacheEleves || force) cacheEleves = tri(await lister("ecole_users", where("role", "==", "eleve")), (u) => norm(u.nom)); return cacheEleves; }
async function classes() { return [...new Set((await eleves()).map((u) => u.classe).filter(Boolean))].sort(); }
function listeClasses(id, cl) { return h("datalist", { id }, ["toutes", ...cl].map((c) => h("option", { value: c }))); }
function choixEleve(liste) { return [["", "— Choisir un élève —"], ...liste.map((u) => [u.id, u.nom + (u.classe ? " (" + u.classe + ")" : "")])]; }

// ---------- connexion ----------
function vueConnexion(erreur) {
  const msg = h("div", { class: erreur ? "erreur" : "info", role: "alert" }, erreur || "");
  const f = h("form", { class: "champs", style: "grid-template-columns:1fr" },
    h("label", {}, "Email", h("input", { name: "email", type: "email", required: true, autocomplete: "username" })),
    h("label", {}, "Mot de passe", h("input", { name: "mdp", type: "password", required: true, autocomplete: "current-password" })),
    h("button", { class: "btn pri", type: "submit" }, "Se connecter"));
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault(); msg.className = "erreur"; msg.textContent = "";
    try { await signInWithEmailAndPassword(auth, f.elements.email.value.trim(), f.elements.mdp.value); }
    catch (e) { msg.textContent = erreurTexte(e); }
  });
  const oublie = h("button", { class: "btn petit", type: "button", onclick: async () => {
    const email = f.elements.email.value.trim(); if (!email) { msg.className = "erreur"; msg.textContent = "Saisissez d'abord votre email."; return; }
    try { await sendPasswordResetEmail(auth, email); msg.className = "info"; msg.textContent = "Un email de réinitialisation vient d'être envoyé."; } catch (e) { msg.className = "erreur"; msg.textContent = erreurTexte(e); }
  } }, "Mot de passe oublié");
  const google = h("button", { class: "btn", type: "button", onclick: async () => {
    msg.className = "erreur"; msg.textContent = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { msg.textContent = erreurTexte(e); }
  } }, "Connexion Direction (Google)");
  $app.replaceChildren(h("div", { class: "connexion" },
    h("div", { class: "ligne", style: "margin-bottom:18px" }, h("span", { class: "logo" }, "WS"), h("div", {}, h("h1", { style: "margin:0;font-size:20px" }, "WEBS- Class room"), h("small", { class: "meta" }, "Centre de formation WEBSERVICES"))),
    h("div", { class: "carte" }, f, msg, h("div", { class: "ligne", style: "margin-top:8px" }, oublie, h("span", { class: "espace" }), google)),
    aide("Votre compte est créé par le secrétariat ou la direction. Pas encore de compte ? Demandez-le à l'école.")));
}

// --- Dossier global de suivi des élèves (direction)
async function sSuiviEleves(m) {
  const el = await eleves(true);
  const choix = h("select", { style: "min-width:260px" },
    h("option", { value: "" }, "— Sélectionner un élève —"),
    ...el.map((u) => h("option", { value: u.id }, (u.nom || "Élève") + (u.classe ? " · " + u.classe : ""))));
  const zone = h("div", {});
  async function charger() {
    zone.replaceChildren();
    if (!choix.value) return;
    const u = el.find((x) => x.id === choix.value);
    const [pres, notes, rendus, quiz, compta, parcours] = await Promise.all([
      lister("ecole_presences", where("uid", "==", u.id)),
      lister("ecole_notes", where("uid", "==", u.id)),
      lister("ecole_rendus", where("uid", "==", u.id)),
      lister("ecole_resultats", where("uid", "==", u.id)),
      lister("ecole_compta", where("uid", "==", u.id)),
      lister("ecole_parcours", where("uid", "==", u.id))
    ]);
    const totalPres = pres.length;
    const presents = pres.filter((x) => x.statut === "Présent").length;
    const absents = pres.filter((x) => x.statut === "Absent").length;
    const retards = pres.filter((x) => x.statut === "Retard").length;
    const assiduite = totalPres ? Math.round((presents / totalPres) * 100) : null;
    const valeurs = [
      ...notes.map((x) => [nombre(x.note), nombre(x.sur) || 20]),
      ...rendus.filter((x) => x.note !== undefined && x.note !== "").map((x) => [nombre(x.note), nombre(x.sur) || 20]),
      ...quiz.map((x) => [nombre(x.score), nombre(x.sur) || 20])
    ].filter(([n, sur]) => Number.isFinite(n) && sur > 0);
    const moyenne = valeurs.length ? valeurs.reduce((a, [n, sur]) => a + n / sur * 20, 0) / valeurs.length : null;
    const soldes = {};
    compta.forEach((x) => { const dv = (x.devise || "USD").toUpperCase(); soldes[dv] = (soldes[dv] || 0) + (x.type === "paiement" ? -1 : 1) * nombre(x.montant); });
    const carteStat = (label, valeur, detail) => h("div", { class: "carte", style: "flex:1 1 155px;min-width:145px;margin:0" },
      h("div", { class: "meta" }, label), h("div", { style: "font-size:25px;font-weight:800;margin:5px 0" }, valeur), h("div", { class: "meta" }, detail || ""));
    const profil = u.profil || {};
    const identite = h("div", { class: "carte" },
      h("div", { class: "ligne" }, h("h3", {}, "Identité et parcours"), h("span", { class: "espace" }), h("span", { class: "puce ok" }, u.actif === false ? "Compte désactivé" : "Compte actif")),
      h("p", {}, h("b", {}, [profil.prenom, profil.postnom, profil.nom].filter(Boolean).join(" ") || u.nom)),
      h("p", { class: "meta" }, [u.classe || profil.filiere, profil.niveau, profil.telephone, profil.email || u.email].filter(Boolean).join(" · ")),
      h("p", { class: "meta" }, [profil.naissance && "Né(e) le " + fmtDate(profil.naissance), profil.lieuNaissance, profil.adresse].filter(Boolean).join(" · ")));
    const formulaireParcours = formulaire([
      { n: "intitule", label: "Étape / activité", req: true },
      { n: "periode", label: "Période (ex. novembre 2026)" },
      { n: "statut", label: "État", type: "select", options: [["En cours","En cours"],["Validé","Validé"],["À renforcer","À renforcer"]], req: true },
      { n: "observation", label: "Observation / objectif", type: "textarea", large: true }
    ], async (d) => {
      await addDoc(collection(db, "ecole_parcours"), { uid: u.id, nom: u.nom, classe: u.classe || "", ...d, date: aujourdhui(), par: moi.nom });
      await charger();
    }, "Ajouter au parcours");
    const parcoursTable = parcours.length ? h("table", {},
      h("tr", {}, h("th", {}, "Étape"), h("th", {}, "Période"), h("th", {}, "État"), h("th", {}, "Observation"), h("th", {}, "Date"), h("th", {})),
      ...tri(parcours, (x) => x.date || "", true).map((x) => h("tr", {},
        h("td", {}, x.intitule), h("td", {}, x.periode), h("td", {}, h("span", { class: "puce " + (x.statut === "Validé" ? "ok" : x.statut === "À renforcer" ? "mal" : "or") }, x.statut)),
        h("td", {}, x.observation), h("td", {}, fmtDate(x.date)), h("td", {}, suppr("ecole_parcours", x, charger))))) : h("p", { class: "vide" }, "Aucune étape de parcours enregistrée.");
    const historiqueFin = compta.length ? h("table", {},
      h("tr", {}, h("th", {}, "Date"), h("th", {}, "Libellé"), h("th", {}, "Opération"), h("th", {}, "Montant")),
      ...tri(compta, (x) => x.date || "", true).map((x) => h("tr", {},
        h("td", {}, fmtDate(x.date)), h("td", {}, x.libelle), h("td", {}, x.type === "paiement" ? "Paiement reçu" : "Frais dus"),
        h("td", {}, nombre(x.montant).toFixed(2) + " " + (x.devise || "USD"))))) : h("p", { class: "vide" }, "Aucune opération financière.");
    const historiqueNotes = valeurs.length ? h("table", {},
      h("tr", {}, h("th", {}, "Évaluation"), h("th", {}, "Note"), h("th", {}, "Date")),
      ...[
        ...notes.map((x) => ({ nom: x.matiere || "Note", note: x.note, sur: x.sur || 20, date: x.date })),
        ...rendus.filter((x) => x.note !== undefined && x.note !== "").map((x) => ({ nom: "Devoir", note: x.note, sur: x.sur || 20, date: x.date })),
        ...quiz.map((x) => ({ nom: x.titre || "Quiz", note: x.score, sur: x.sur || 20, date: x.date }))
      ].map((x) => h("tr", {}, h("td", {}, x.nom), h("td", {}, nombre(x.note) + "/" + nombre(x.sur)), h("td", {}, fmtDate(x.date))))) : h("p", { class: "vide" }, "Aucun résultat scolaire enregistré.");
    zone.replaceChildren(
      identite,
      h("div", { class: "ligne", style: "align-items:stretch;flex-wrap:wrap" },
        carteStat("ASSIDUITÉ", assiduite === null ? "—" : assiduite + "%", presents + " présents · " + absents + " absences · " + retards + " retards"),
        carteStat("MOYENNE GÉNÉRALE", moyenne === null ? "—" : moyenne.toFixed(2) + "/20", valeurs.length + " résultat(s) pris en compte"),
        ...Object.entries(soldes).map(([dv, v]) => carteStat("SOLDE " + dv, Math.abs(v).toFixed(2) + " " + dv, v > 0 ? "Reste à payer" : v < 0 ? "Crédit élève" : "Soldé"))
      ),
      h("div", { class: "carte" }, h("h3", {}, "Parcours de formation"), aide("Consignez les étapes, objectifs, validations et observations propres à cet élève."), formulaireParcours, parcoursTable),
      h("div", { class: "carte" }, h("h3", {}, "Résultats scolaires"), historiqueNotes),
      h("div", { class: "carte" }, h("h3", {}, "Présences et assiduité"),
        h("p", { class: "meta" }, presents + " présent(s) · " + absents + " absent(s) · " + retards + " retard(s) · " + totalPres + " séance(s) enregistrée(s)"),
        pres.length ? h("table", {}, h("tr", {}, h("th", {}, "Date"), h("th", {}, "Statut")), ...tri(pres, (x) => x.date || "", true).map((x) => h("tr", {}, h("td", {}, fmtDate(x.date)), h("td", {}, x.statut)))) : h("p", { class: "vide" }, "Aucun appel enregistré.")),
      h("div", { class: "carte" }, h("h3", {}, "Situation financière"), historiqueFin)
    );
  }
  choix.addEventListener("change", charger);
  monter(m, ...titre("Suivi complet des élèves", "Une vue individuelle du parcours, de l’assiduité, des résultats et de la situation financière."),
    h("div", { class: "carte ligne" }, h("label", {}, "Choisir un élève", choix)), zone);
}

// ---------- sections ----------
const SECTIONS = [
  { id: "accueil", nom: "Accueil", ico: "⌂", roles: null, rendu: sAccueil },
  { id: "suivi", nom: "Suivi des élèves", ico: "📊", roles: ["direction"], rendu: sSuiviEleves },
  { id: "annonces", nom: "Annonces", ico: "📣", roles: null, rendu: sAnnonces },
  { id: "planning", nom: "Planning", ico: "🗓", roles: null, rendu: sPlanning },
  { id: "cours", nom: "Cours & documents", ico: "📚", roles: null, rendu: sCours },

onAuthStateChanged(auth, async (user) => {
  cacheEleves = null; moi = null;

  $app.replaceChildren(h("p", { class: "vide" }, "Connexion…"));

    const email = String(user.email || "").toLowerCase();
    const ref = doc(db, "ecole_users", user.uid);
    if (DIRECTION_EMAIL && email === DIRECTION_EMAIL && user.emailVerified !== false) {
      const s = await getDoc(ref);

      if (!s.exists()) await setDoc(ref, { nom: moi.nom, email, role: "direction", classe: "", actif: true, cree: new Date().toISOString() });
    } else {
      const s = await getDoc(ref);
      if (!s.exists() || s.data().actif === false) { await signOut(auth); vueConnexion("Ce compte n'est pas (ou plus) activé pour la classe. Contactez le secrétariat."); return; }
      const d = s.data(); moi = { uid: user.uid, nom: d.nom || email, email, role: d.role, classe: d.classe || "" };
    }
    if (!ROLES[moi.role]) { await signOut(auth); vueConnexion("Rôle inconnu pour ce compte."); return; }
    vueCourante = "accueil"; vueApp();
  } catch (e) { await signOut(auth).catch(() => {}); vueConnexion(erreurTexte(e)); }

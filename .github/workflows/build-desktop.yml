# Fabrique l'application Windows « Lecteur Pro » et la publie dans l'onglet Releases du dépôt.
# Lancement : GitHub > Actions > « Application Windows Lecteur Pro » > Run workflow.
name: Application Windows Lecteur Pro

on:
  workflow_dispatch:
  push:
    paths:
      - "public/television.html"
      - "desktop/main.js"
      - "desktop/preload.js"
      - "desktop/telechargement.js"
      - "desktop/package.json"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer les fichiers de l'application
        shell: bash
        run: |
          cp public/television.html desktop/television.html
          cp public/icone-512.png desktop/icon.png
      - name: Installer et construire
        shell: bash
        working-directory: desktop
        run: |
          npm install
          npm run build
      - name: Publier l'installateur
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "lecteur-pro-v${{ github.run_number }}" \
            "desktop/dist/Lecteur-Pro-Installation-x64.exe" "desktop/dist/Lecteur-Pro-Installation-ia32.exe" \
            --title "Lecteur Pro pour Windows (v${{ github.run_number }})" \
            --notes "Deux versions : choisissez celle de votre ordinateur. x64 = Windows 64 bits (le plus courant), ia32 = Windows 32 bits. Téléchargez, puis double-cliquez pour installer."

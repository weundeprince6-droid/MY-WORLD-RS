name: Application Windows WEBSERVICES ACADEMY

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop-academy/**"
      - ".github/workflows/build-academy-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop-academy/package.json
      - name: Préparer l'icône Academy
        shell: bash
        run: cp public/academy-512.png desktop-academy/icon.png
      - name: Installer les dépendances et construire avec publication des métadonnées de mise à jour
        working-directory: desktop-academy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install
          npm run build

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101820"><title>Activer une licence — Lecteur Pro</title><style>
:root{color-scheme:dark;--bg:#0d151b;--panel:#17242d;--line:#30434b;--text:#f2f7f5;--muted:#a8b8b2;--green:#25b77b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#123c35 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.5 Segoe UI,system-ui,sans-serif;display:grid;place-items:center;padding:18px}.box{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:25px}.brand{font-size:21px;font-weight:900}.brand span{color:var(--green)}h1{margin:24px 0 6px;font-size:29px}.muted{color:var(--muted)}label{display:block;margin:18px 0 6px;color:var(--muted);font-size:13px}input{width:100%;padding:14px;border:1px solid var(--line);border-radius:11px;background:#0e171e;color:var(--text);font:700 16px ui-monospace,monospace}button,a{display:inline-block;padding:12px 15px;border-radius:10px;border:1px solid var(--line);background:#22343d;color:var(--text);font-weight:750;text-decoration:none;cursor:pointer}button.primary{background:var(--green);color:#062116;border-color:var(--green);width:100%;margin-top:14px}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.status{margin-top:15px;padding:12px;border-radius:10px;background:#12252a;color:#b9e9d3;white-space:pre-wrap}.error{background:#321d21;color:#ffc6c6}.hidden{display:none!important}</style></head><body><main class="box"><div class="brand">🎬 <span>LECTEUR</span> PRO</div><h1>Activer ma licence</h1><p class="muted">Connectez-vous avec l'adresse e-mail utilisée lors de l'achat, puis saisissez votre code de licence.</p><div class="row"><button id="login">Se connecter avec Google</button><button id="logout" class="hidden">Déconnexion</button><a href="lecteur-pro-offres.html">Voir les offres</a></div><div id="account" class="muted"></div><section id="form" class="hidden"><label for="code">Code de licence</label><input id="code" placeholder="LP-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" autocomplete="off" autocapitalize="characters"><button id="activate" class="primary">Activer ma licence</button><button id="check" style="width:100%;margin-top:9px">Vérifier mon abonnement</button></section><div id="status" class="status">La connexion est nécessaire pour activer une licence.</div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{firebaseConfig}from"./config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),provider=new GoogleAuthProvider(),base="https://us-central1-my-world-rs.cloudfunctions.net/";let user=null;const $=id=>document.getElementById(id);
function status(t,e=false){$("status").textContent=t;$("status").classList.toggle("error",e)}
async function api(name,data={}){const token=await user.getIdToken();const r=await fetch(base+name,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||"Erreur serveur.");return j}
onAuthStateChanged(auth,async u=>{user=u;$("login").classList.toggle("hidden",!!u);$("logout").classList.toggle("hidden",!u);$("form").classList.toggle("hidden",!u);$("account").textContent=u?"Connecté : "+u.email:"";if(u)await check()});
$("login").onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){status(e.message,true)}};$("logout").onclick=()=>signOut(auth);
async function check(){try{const x=await api("lecteurProGetEntitlement");status(x.active?"Licence active : "+x.planLabel+(x.expiresAt?" — expiration : "+new Date(x.expiresAt).toLocaleDateString("fr-FR"):" — accès à vie"):"Aucun abonnement Premium actif. Vous utilisez la formule Free.")}catch(e){status(e.message,true)}}
$("check").onclick=check;$("activate").onclick=async()=>{try{const x=await api("lecteurProActivateLicense",{code:$("code").value});status("Licence activée : "+x.entitlement.planLabel+". Vous pouvez maintenant retrouver votre accès Premium.");$("code").value="";await check()}catch(e){status(e.message,true)}};
</script></body></html>

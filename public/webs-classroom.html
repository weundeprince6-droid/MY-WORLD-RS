<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WEBS- Class room</title>
<style>
:root{--bg:#0b1220;--carte:#131c2e;--carte2:#1a2540;--bord:#27344f;--txt:#e8ecf4;--doux:#9aa7c0;--or:#f5b942;--ok:#3ecf8e;--mal:#ff6b6b;--bleu:#5aa2ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--bleu)}
.haut{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#08101d;border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:5}
.logo{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--or);color:#1a1200;font-weight:800}
.haut h1{margin:0;font-size:17px;line-height:1.1}.haut small{color:var(--doux)}
.espace{flex:1}
.moi{text-align:right;font-size:13px}.moi b{display:block}
.pose{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 63px)}
nav{padding:14px 10px;border-right:1px solid var(--bord);display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--doux)}
nav button:hover{background:var(--carte)}nav button.actif{background:var(--carte2);color:var(--or);font-weight:600}
main{padding:20px;max-width:1000px;width:100%}
h2{margin:0 0 4px;font-size:22px}.sous{color:var(--doux);margin:0 0 18px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:16px;margin-bottom:14px}
.carte h3{margin:0 0 4px;font-size:16px}.meta{color:var(--doux);font-size:13px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne .espace{flex:1}
.btn{border:1px solid var(--bord);background:var(--carte2);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--or)}.btn.pri{background:var(--or);color:#1a1200;border-color:var(--or);font-weight:700}
.btn.mal{color:var(--mal)}.btn.petit{padding:4px 10px;font-size:13px}
.puce{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bord);color:var(--doux)}
.puce.ok{color:var(--ok);border-color:var(--ok)}.puce.mal{color:var(--mal);border-color:var(--mal)}.puce.or{color:var(--or);border-color:var(--or)}
form.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--doux)}label.large{grid-column:1/-1}
input,select,textarea{background:#0d1526;border:1px solid var(--bord);border-radius:9px;padding:9px 10px;color:var(--txt);width:100%}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bord);text-align:left;vertical-align:top}th{color:var(--doux);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.vide{color:var(--doux);padding:18px;text-align:center}
.erreur{color:var(--mal);margin:8px 0}.info{color:var(--ok);margin:8px 0}
.connexion{max-width:400px;margin:8vh auto;padding:0 18px}
dialog{background:var(--carte);color:var(--txt);border:1px solid var(--bord);border-radius:16px;padding:20px;width:min(680px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
.q{margin:14px 0}.q p{margin:0 0 6px;font-weight:600}.q label{flex-direction:row;align-items:center;color:var(--txt);gap:8px;padding:4px 0}.q input{width:auto}
.jour{margin-top:14px;color:var(--or);font-weight:700}
.rond{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--doux)}
@media(max-width:760px){.pose{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--bord)}nav button{white-space:nowrap}main{padding:14px}}
</style>
</head>
<body>
<div id="app"><p class="vide">Chargement…</p></div>
<dialog id="dlg"></dialog>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, reglages } from "./config.js";

const DIRECTION_EMAIL = String(reglages.allowedGoogleEmail || "").toLowerCase();
const ROLES = { direction: "Direction", enseignant: "Enseignant", eleve: "Élève", comptable: "Comptable", secretaire: "Secrétaire" };
const STAFF = ["direction", "enseignant", "secretaire", "comptable"];

// Application nommée : la session de la classe reste séparée de celle de MY WORLD RS.
const app = initializeApp(firebaseConfig, "classroom");
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- petits outils ----------
const $app = document.getElementById("app");
const dlg = document.getElementById("dlg");
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const aujourdhui = () => new Date().toISOString().slice(0, 10);
const fmtDate = (d) => { if (!d) return ""; const x = new Date(String(d).length <= 10 ? d + "T12:00:00" : d); return isNaN(x) ? String(d) : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); };
const nombre = (v) => Number(String(v).replace(",", "."));
const norm = (s) => String(s || "").trim().toLowerCase();
const tri = (arr, f, desc) => arr.slice().sort((a, b) => (String(f(a)) < String(f(b)) ? -1 : String(f(a)) > String(f(b)) ? 1 : 0) * (desc ? -1 : 1));
const sans = (o) => { const c = { ...o }; delete c.id; return c; };
const aide = (t) => h("p", { class: "meta" }, t);

const monter = (el, ...items) => el.replaceChildren(...items.flat(Infinity).filter((x) => x != null && x !== false));
function fermer() { if (dlg.open) dlg.close(); }
function modal(titre, ...contenu) {
  monter(dlg, h("div", { class: "ligne" }, h("h2", { style: "font-size:19px" }, titre), h("span", { class: "espace" }), h("button", { class: "btn petit", onclick: fermer, type: "button" }, "Fermer")), contenu);
  if (!dlg.open) dlg.showModal();
}

async function lister(nom, ...contraintes) {
  const s = await getDocs(contraintes.length ? query(collection(db, nom), ...contraintes) : collection(db, nom));
  return s.docs.map((d) => ({ id: d.id, ...d.data() }));
}

// Formulaire généré : champs = [{n, label, type, options, req, val, large, liste}]
function formulaire(champs, enregistrer, libelle = "Enregistrer") {
  const f = h("form", { class: "champs" });
  const msg = h("div", { class: "erreur", role: "alert", style: "grid-column:1/-1" });
  for (const c of champs) {
    let ctl;
    if (c.type === "textarea") ctl = h("textarea", { name: c.n, required: c.req, placeholder: c.ph || "" });
    else if (c.type === "select") ctl = h("select", { name: c.n, required: c.req }, c.options.map((o) => { const [v, l] = Array.isArray(o) ? o : [o, o]; return h("option", { value: v }, l); }));
    else ctl = h("input", { name: c.n, type: c.type || "text", required: c.req, placeholder: c.ph || "", list: c.liste, step: c.type === "number" ? "any" : null, autocomplete: c.type === "password" ? "new-password" : "off" });
    if (c.val != null) ctl.value = c.val;
    f.append(h("label", { class: c.large || c.type === "textarea" ? "large" : "" }, c.label + (c.req ? " *" : ""), ctl));
  }
  const bouton = h("button", { class: "btn pri", type: "submit" }, libelle);
  f.append(msg, h("div", { style: "grid-column:1/-1" }, bouton));
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault(); msg.textContent = ""; bouton.disabled = true;
    try { const data = {}; for (const c of champs) data[c.n] = f.elements[c.n].value.trim(); await enregistrer(data, f); }
    catch (e) { msg.textContent = erreurTexte(e); }
    finally { bouton.disabled = false; }
  });
  return f;
}
function erreurTexte(e) {
  const c = e && e.code || "";
  if (c === "permission-denied" || /permission/i.test(e && e.message || "")) return "Accès refusé : vos droits ne permettent pas cette action (ou les règles Firestore ne sont pas encore publiées).";
  const m = { "auth/invalid-credential": "Email ou mot de passe incorrect.", "auth/wrong-password": "Email ou mot de passe incorrect.", "auth/user-not-found": "Email ou mot de passe incorrect.", "auth/invalid-email": "Adresse email invalide.", "auth/too-many-requests": "Trop de tentatives. Réessayez dans quelques minutes.", "auth/email-already-in-use": "Cet email a déjà un compte.", "auth/weak-password": "Mot de passe trop court (6 caractères minimum).", "auth/operation-not-allowed": "La connexion par email n'est pas activée dans Firebase (Authentication → Sign-in method).", "auth/popup-closed-by-user": "Fenêtre de connexion fermée.", "auth/network-request-failed": "Pas de connexion internet." };
  return m[c] || (e && e.message) || "Erreur inattendue.";
}

// ---------- état ----------
let moi = null; // { uid, nom, email, role, classe }
let vueCourante = "accueil";
const estStaff = () => STAFF.includes(moi.role);
const peut = (...roles) => roles.includes(moi.role);
const visible = (x) => { if (estStaff()) return true; const c = norm(x.classe); return !c || c === "toutes" || c === norm(moi.classe); };
let cacheEleves = null;
async function eleves(force) { if (!cacheEleves || force) cacheEleves = tri(await lister("ecole_users", where("role", "==", "eleve")), (u) => norm(u.nom)); return cacheEleves; }
async function classes() { return [...new Set((await eleves()).map((u) => u.classe).filter(Boolean))].sort(); }
function listeClasses(id, cl) { return h("datalist", { id }, ["toutes", ...cl].map((c) => h("option", { value: c }))); }
function choixEleve(liste) { return [["", "— Choisir un élève —"], ...liste.map((u) => [u.id, u.nom + (u.classe ? " (" + u.classe + ")" : "")])]; }

// ---------- connexion ----------
function vueConnexion(erreur) {
  const msg = h("div", { class: erreur ? "erreur" : "info", role: "alert" }, erreur || "");
  const f = h("form", { class: "champs", style: "grid-template-columns:1fr" },
    h("label", {}, "Email", h("input", { name: "email", type: "email", required: true, autocomplete: "username" })),
    h("label", {}, "Mot de passe", h("input", { name: "mdp", type: "password", required: true, autocomplete: "current-password" })),
    h("button", { class: "btn pri", type: "submit" }, "Se connecter"));
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault(); msg.className = "erreur"; msg.textContent = "";
    try { await signInWithEmailAndPassword(auth, f.elements.email.value.trim(), f.elements.mdp.value); }
    catch (e) { msg.textContent = erreurTexte(e); }
  });
  const oublie = h("button", { class: "btn petit", type: "button", onclick: async () => {
    const email = f.elements.email.value.trim(); if (!email) { msg.className = "erreur"; msg.textContent = "Saisissez d'abord votre email."; return; }
    try { await sendPasswordResetEmail(auth, email); msg.className = "info"; msg.textContent = "Un email de réinitialisation vient d'être envoyé."; } catch (e) { msg.className = "erreur"; msg.textContent = erreurTexte(e); }
  } }, "Mot de passe oublié");
  const google = h("button", { class: "btn", type: "button", onclick: async () => {
    msg.className = "erreur"; msg.textContent = "";
    try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { msg.textContent = erreurTexte(e); }
  } }, "Connexion Direction (Google)");
  $app.replaceChildren(h("div", { class: "connexion" },
    h("div", { class: "ligne", style: "margin-bottom:18px" }, h("span", { class: "logo" }, "WS"), h("div", {}, h("h1", { style: "margin:0;font-size:20px" }, "WEBS- Class room"), h("small", { class: "meta" }, "Centre de formation WEBSERVICES"))),
    h("div", { class: "carte" }, f, msg, h("div", { class: "ligne", style: "margin-top:8px" }, oublie, h("span", { class: "espace" }), google)),
    aide("Votre compte est créé par le secrétariat ou la direction. Pas encore de compte ? Demandez-le à l'école.")));
}

// ---------- sections ----------
const SECTIONS = [
  { id: "accueil", nom: "Accueil", ico: "⌂", roles: null, rendu: sAccueil },
  { id: "annonces", nom: "Annonces", ico: "📣", roles: null, rendu: sAnnonces },
  { id: "planning", nom: "Planning", ico: "🗓", roles: null, rendu: sPlanning },
  { id: "cours", nom: "Cours & documents", ico: "📚", roles: null, rendu: sCours },
  { id: "devoirs", nom: "Devoirs", ico: "📝", roles: null, rendu: sDevoirs },
  { id: "quiz", nom: "Quiz", ico: "❓", roles: null, rendu: sQuiz },
  { id: "notes", nom: "Notes", ico: "🎓", roles: ["eleve", "enseignant", "direction"], rendu: sNotes },
  { id: "presences", nom: "Présences", ico: "✅", roles: ["eleve", "enseignant", "secretaire", "direction"], rendu: sPresences },
  { id: "compta", nom: "Frais & comptabilité", ico: "💰", roles: ["eleve", "comptable", "direction"], rendu: sCompta },
  { id: "utilisateurs", nom: "Élèves & personnel", ico: "👥", roles: ["secretaire", "direction"], rendu: sUtilisateurs },
];
const sectionsPour = () => SECTIONS.filter((s) => !s.roles || s.roles.includes(moi.role));

function vueApp() {
  const nav = h("nav", {}, sectionsPour().map((s) => h("button", { class: s.id === vueCourante ? "actif" : "", onclick: () => { vueCourante = s.id; vueApp(); } }, h("span", {}, s.ico), s.nom)));
  const main = h("main", {}, h("p", { class: "vide" }, "Chargement…"));
  $app.replaceChildren(
    h("header", { class: "haut" }, h("span", { class: "logo" }, "WS"), h("div", {}, h("h1", {}, "WEBS- Class room"), h("small", { class: "meta" }, "Centre de formation WEBSERVICES")), h("span", { class: "espace" }),
      h("div", { class: "moi" }, h("b", {}, moi.nom), h("span", { class: "meta" }, ROLES[moi.role] + (moi.classe ? " · " + moi.classe : ""))),
      h("button", { class: "btn petit", onclick: () => signOut(auth) }, "Déconnexion")),
    h("div", { class: "pose" }, nav, main));
  const s = sectionsPour().find((x) => x.id === vueCourante) || SECTIONS[0];
  s.rendu(main).catch((e) => main.replaceChildren(h("div", { class: "carte erreur" }, erreurTexte(e))));
}
const titre = (t, s) => [h("h2", {}, t), h("p", { class: "sous" }, s || "")];
const suppr = (coll, x, apres) => h("button", { class: "btn petit mal", onclick: async () => { if (!confirm("Supprimer définitivement ?")) return; await deleteDoc(doc(db, coll, x.id)); apres(); } }, "Supprimer");
const rafraichir = () => vueApp();

// --- Accueil
async function sAccueil(m) {
  const [ann, dev] = await Promise.all([lister("ecole_annonces"), lister("ecole_devoirs")]);
  const a = tri(ann.filter(visible), (x) => x.date || "", true).slice(0, 3);
  const d = tri(dev.filter(visible).filter((x) => (x.limite || "9999") >= aujourdhui()), (x) => x.limite || "9999").slice(0, 5);
  monter(m, ...titre("Bonjour " + moi.nom.split(" ")[0], ROLES[moi.role] + (moi.classe ? " · classe " + moi.classe : "")),
    h("div", { class: "carte" }, h("h3", {}, "Dernières annonces"), a.length ? a.map((x) => h("p", {}, h("b", {}, x.titre), " — ", x.texte.slice(0, 140), h("span", { class: "meta" }, " · " + fmtDate(x.date)))) : h("p", { class: "vide" }, "Aucune annonce.")),
    h("div", { class: "carte" }, h("h3", {}, "Devoirs à venir"), d.length ? d.map((x) => h("p", {}, h("b", {}, x.titre), h("span", { class: "meta" }, " · " + (x.matiere || "") + " · à rendre le " + fmtDate(x.limite)))) : h("p", { class: "vide" }, "Aucun devoir à rendre pour le moment.")));
}

// --- Annonces
async function sAnnonces(m) {
  const cl = await (estStaff() ? classes() : Promise.resolve([]));
  const liste = tri((await lister("ecole_annonces")).filter(visible), (x) => x.date || "", true);
  const peutEcrire = peut("direction", "enseignant", "secretaire");
  monter(m, ...titre("Annonces", "Informations de l'école et de votre classe."),
    peutEcrire && h("div", { class: "carte" }, h("h3", {}, "Nouvelle annonce"), listeClasses("dl-cl", cl), formulaire([
      { n: "titre", label: "Titre", req: true }, { n: "classe", label: "Classe concernée", val: "toutes", liste: "dl-cl" },
      { n: "texte", label: "Message", type: "textarea", req: true }], async (d) => { await addDoc(collection(db, "ecole_annonces"), { ...d, auteur: moi.nom, uid: moi.uid, date: new Date().toISOString() }); rafraichir(); }, "Publier")),
    liste.length ? liste.map((x) => h("div", { class: "carte" }, h("div", { class: "ligne" }, h("h3", {}, x.titre), h("span", { class: "espace" }), h("span", { class: "puce" }, x.classe || "toutes"), (peut("direction") || x.uid === moi.uid) && suppr("ecole_annonces", x, rafraichir)), h("p", { style: "white-space:pre-wrap" }, x.texte), h("p", { class: "meta" }, x.auteur + " · " + fmtDate(x.date)))) : h("p", { class: "vide" }, "Aucune annonce."));
}

// --- Planning
async function sPlanning(m) {
  const cl = await (estStaff() ? classes() : Promise.resolve([]));
  const liste = (await lister("ecole_planning")).filter(visible);
  const jours = ["Lundi", "Mardi", "Mercredi", "Jeudi", "Vendredi", "Samedi", "Dimanche"];
  const peutEcrire = peut("direction", "secretaire", "enseignant");
  monter(m, ...titre("Planning", "Emploi du temps des cours."),
    peutEcrire && h("div", { class: "carte" }, h("h3", {}, "Ajouter un cours"), listeClasses("dl-cl2", cl), formulaire([
      { n: "jour", label: "Jour", type: "select", options: jours, req: true }, { n: "debut", label: "Début", type: "time", req: true }, { n: "fin", label: "Fin", type: "time", req: true },
      { n: "matiere", label: "Matière", req: true }, { n: "enseignant", label: "Enseignant" }, { n: "salle", label: "Salle" }, { n: "classe", label: "Classe", val: "toutes", liste: "dl-cl2" }],
      async (d) => { await addDoc(collection(db, "ecole_planning"), d); rafraichir(); }, "Ajouter au planning")),
    jours.map((j) => { const l = tri(liste.filter((x) => x.jour === j), (x) => x.debut); return l.length ? h("div", {}, h("div", { class: "jour" }, j), l.map((x) => h("div", { class: "carte" }, h("div", { class: "ligne" }, h("b", {}, x.debut + " – " + x.fin), h("span", {}, x.matiere), h("span", { class: "meta" }, [x.enseignant, x.salle && "salle " + x.salle].filter(Boolean).join(" · ")), h("span", { class: "espace" }), h("span", { class: "puce" }, x.classe || "toutes"), peutEcrire && suppr("ecole_planning", x, rafraichir))))) : null; }),
    !liste.length && h("p", { class: "vide" }, "Aucun cours planifié."));
}

// --- Cours
async function sCours(m) {
  const cl = await (estStaff() ? classes() : Promise.resolve([]));
  const liste = tri((await lister("ecole_cours")).filter(visible), (x) => x.date || "", true);
  const peutEcrire = peut("direction", "enseignant");
  monter(m, ...titre("Cours & documents", "Supports de cours : liens Google Drive, YouTube, PDF…"),
    peutEcrire && h("div", { class: "carte" }, h("h3", {}, "Publier un cours"), listeClasses("dl-cl3", cl), formulaire([
      { n: "titre", label: "Titre", req: true }, { n: "matiere", label: "Matière" }, { n: "classe", label: "Classe", val: "toutes", liste: "dl-cl3" },
      { n: "lien", label: "Lien du document (https://…)", type: "url", large: true }, { n: "description", label: "Description", type: "textarea" }],
      async (d) => { await addDoc(collection(db, "ecole_cours"), { ...d, auteur: moi.nom, uid: moi.uid, date: new Date().toISOString() }); rafraichir(); }, "Publier")),
    liste.length ? liste.map((x) => h("div", { class: "carte" }, h("div", { class: "ligne" }, h("h3", {}, x.titre), h("span", { class: "puce or" }, x.matiere || "Cours"), h("span", { class: "espace" }), h("span", { class: "puce" }, x.classe || "toutes"), (peut("direction") || x.uid === moi.uid) && suppr("ecole_cours", x, rafraichir)), x.description && h("p", { style: "white-space:pre-wrap" }, x.description), x.lien && /^https?:\/\//i.test(x.lien) && h("p", {}, h("a", { href: x.lien, target: "_blank", rel: "noopener noreferrer" }, "Ouvrir le document ↗")), h("p", { class: "meta" }, x.auteur + " · " + fmtDate(x.date)))) : h("p", { class: "vide" }, "Aucun cours publié."));
}

// --- Devoirs
async function sDevoirs(m) {

  } catch (e) { await signOut(auth).catch(() => {}); vueConnexion(erreurTexte(e)); }
});
</script>
</body>

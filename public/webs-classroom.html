<style>
:root{--bg:#0b1220;--carte:#131c2e;--carte2:#1a2540;--bord:#27344f;--txt:#e8ecf4;--doux:#9aa7c0;--or:#f5b942;--ok:#3ecf8e;--mal:#ff6b6b;--bleu:#5aa2ff}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}

.haut h1{margin:0;font-size:17px;line-height:1.1}.haut small{color:var(--doux)}
.espace{flex:1}
.moi{text-align:right;font-size:13px}.moi b{display:block}
.pose{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 63px)}
nav{padding:14px 10px;border-right:1px solid var(--bord);display:flex;flex-direction:column;gap:4px}
nav button{display:flex;gap:10px;align-items:center;text-align:left;padding:10px 12px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--doux)}
nav button:hover{background:var(--carte)}nav button.actif{background:var(--carte2);color:var(--or);font-weight:600}
main{padding:20px;max-width:1000px;width:100%}
h2{margin:0 0 4px;font-size:22px}.sous{color:var(--doux);margin:0 0 18px}
.carte{background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:16px;margin-bottom:14px}
.carte h3{margin:0 0 4px;font-size:16px}.meta{color:var(--doux);font-size:13px}
.ligne{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ligne .espace{flex:1}
.btn{border:1px solid var(--bord);background:var(--carte2);padding:8px 14px;border-radius:10px;cursor:pointer}
.btn:hover{border-color:var(--or)}.btn.pri{background:var(--or);color:#1a1200;border-color:var(--or);font-weight:700}
.btn.mal{color:var(--mal)}.btn.petit{padding:4px 10px;font-size:13px}
.puce{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--bord);color:var(--doux)}
.puce.ok{color:var(--ok);border-color:var(--ok)}.puce.mal{color:var(--mal);border-color:var(--mal)}.puce.or{color:var(--or);border-color:var(--or)}
form.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--doux)}label.large{grid-column:1/-1}
input,select,textarea{background:#0d1526;border:1px solid var(--bord);border-radius:9px;padding:9px 10px;color:var(--txt);width:100%}
textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus{outline:2px solid var(--or);outline-offset:-1px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px 10px;border-bottom:1px solid var(--bord);text-align:left;vertical-align:top}th{color:var(--doux);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.vide{color:var(--doux);padding:18px;text-align:center}
.erreur{color:var(--mal);margin:8px 0}.info{color:var(--ok);margin:8px 0}
.connexion{max-width:400px;margin:8vh auto;padding:0 18px}
dialog{background:var(--carte);color:var(--txt);border:1px solid var(--bord);border-radius:16px;padding:20px;width:min(680px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:#000a}
.q{margin:14px 0}.q p{margin:0 0 6px;font-weight:600}.q label{flex-direction:row;align-items:center;color:var(--txt);gap:8px;padding:4px 0}.q input{width:auto}
.jour{margin-top:14px;color:var(--or);font-weight:700}
.rond{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--doux)}

.brevet-selection{margin-top:14px}.brevet-wizard{margin-top:14px;background:var(--carte);border:1px solid var(--bord);border-radius:18px;padding:18px;box-shadow:0 12px 34px #0000000c}
.brevet-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
.brevet-tab{display:flex;align-items:center;gap:9px;text-align:left;padding:12px 10px;border:1px solid var(--bord);border-radius:12px;background:transparent;color:var(--txt);font:600 12px Arial,sans-serif;cursor:pointer;min-height:56px}
.brevet-tab span{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:9px;background:var(--fond);color:var(--doux);font-size:11px}
.brevet-tab.active{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 9%,var(--carte));color:var(--txt)}
.brevet-tab.active span,.brevet-tab.complete span{background:var(--bleu);color:white}
.brevet-panel{padding:4px 2px 16px}.brevet-panel h3{font-size:19px;margin:0 0 5px}.brevet-panel>.meta{margin:0 0 18px}
.brevet-champs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.brevet-champs label{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:650;color:var(--txt)}
.brevet-champs input,.brevet-champs select{width:100%;min-height:44px;border:1px solid var(--bord);border-radius:10px;padding:10px 12px;background:var(--fond);color:var(--txt);font:inherit}
.brevet-champs .champ-photo{grid-column:1/-1;padding:16px;border:1px dashed var(--bleu);border-radius:12px;background:color-mix(in srgb,var(--bleu) 5%,var(--carte))}
.brevet-navigation{display:flex;align-items:center;gap:9px;border-top:1px solid var(--bord);padding-top:15px;margin-top:10px}.etape-compteur{margin-right:auto;color:var(--doux);font-size:12px;font-weight:700}.brevet-erreur{color:var(--mal);font-size:13px;min-height:20px;margin:6px 0}
.ecran-brevet{position:fixed;inset:0;z-index:50;background:#0b1220f2;overflow:auto;padding:18px}
.ecran-brevet .barre{display:flex;align-items:center;justify-content:flex-end;gap:10px;max-width:1180px;margin:0 auto 14px}
.barre-titre{margin-right:auto;color:#fff;display:flex;flex-direction:column;gap:3px}.barre-titre b{font-size:15px}.barre-titre span{font-size:11px;color:#b6c2d3}

.brevet{position:relative;display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;width:min(1180px,100%);min-height:790px;margin:0 auto;background:#fff;color:#14123a;box-shadow:0 22px 70px #0007;overflow:hidden;font-family:Georgia,"Times New Roman",serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.brevet:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 118%,#0000 0 26px,#c9962b12 26px 27px);pointer-events:none}
.orn{position:absolute;width:250px;height:140px;pointer-events:none}.orn:before,.orn:after{content:"";position:absolute;inset:0}
.orn:before{background:linear-gradient(135deg,#f3d98b,#c9962b 55%,#f3d98b);clip-path:polygon(0 0,100% 0,0 100%)}.orn:after{background:#14123a;clip-path:polygon(0 0,91% 0,0 88%)}
.orn.hg{top:0;left:0}.orn.bd{bottom:0;right:0;width:190px;height:106px;transform:rotate(180deg)}
.eq{position:absolute;width:84px;height:52px;border:3px solid #14123a;pointer-events:none}.eq.hd{top:18px;right:22px;border-left:0;border-bottom:0}.eq.bg{bottom:18px;left:22px;border-right:0;border-top:0}
.brevet-aside{position:relative;background:none;color:#14123a;padding:22px 64px 4px;display:grid;grid-template-columns:200px 1fr 200px;grid-template-rows:auto auto auto;align-items:start;gap:2px 22px;text-align:center}
.monogramme{grid-column:2;grid-row:1;width:84px;height:84px;margin:0 auto}.monogramme svg{width:100%;height:100%;display:block}
.aside-label{grid-column:2;grid-row:2;font:700 12px Arial,sans-serif;letter-spacing:5px;color:#14123a}.aside-label b{display:inline;margin-left:8px;color:#14123a;font-size:12px;letter-spacing:5px}
.photo-candidat{grid-column:3;grid-row:1/4;width:112px;height:132px;object-fit:cover;background:#e8edf2;border:4px solid #c9962b;outline:2px solid #14123a;outline-offset:2px;margin:36px auto 0}
.photo-vide{grid-column:3;grid-row:1/4;width:112px;height:132px;display:grid;place-items:center;background:#f4f1e8;border:4px solid #c9962b;outline:2px solid #14123a;outline-offset:2px;color:#777;font:11px Arial,sans-serif;letter-spacing:1px;margin:36px auto 0}
.aside-num{grid-column:2;grid-row:3;margin:2px auto 0;font:10px Arial,sans-serif;letter-spacing:2px;color:#777}.aside-num b{display:inline-block;color:#14123a;font:700 12px monospace;margin-left:8px;overflow-wrap:anywhere}.aside-type{display:none}
.brevet-main{padding:0 70px 22px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.sur-titre{font:700 10px Arial,sans-serif;letter-spacing:3px;color:#a87a1c;text-transform:uppercase}
.brevet-main h1{font:700 48px Georgia,serif;letter-spacing:9px;color:#14123a;margin:8px 0 4px;text-transform:uppercase;line-height:1.05}
.trait-or{height:3px;width:130px;background:linear-gradient(90deg,#0000,#c9962b,#0000);margin-bottom:10px}
.certifie{font:600 13px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#555;margin:0 0 2px}
.nom-candidat{font:400 58px "Great Vibes","Brush Script MT","Segoe Script",cursive;color:#14123a;margin:0;text-transform:none;letter-spacing:0;line-height:1.25;border-bottom:2px dotted #14123a;padding:0 40px 2px;min-width:60%}
.naissance{font:12px Arial,sans-serif;color:#666;margin:8px 0 12px}
.details-formation{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:0 0 8px}
.details-formation>div{padding:8px 14px;background:#faf8f1;border:1px solid #eadfc2;border-left:3px solid #c9962b;min-height:46px}.details-formation>div:first-child{grid-column:1/-1}
.details-formation span,.resultat span{display:block;font:700 9px Arial,sans-serif;letter-spacing:1.4px;color:#8a7a52;margin-bottom:4px}.details-formation b{font:700 13px Arial,sans-serif;color:#14123a}
.resultat{display:grid;grid-template-columns:1fr 1fr;width:100%;border:1px solid #eadfc2;margin:0 0 8px}.resultat>div{padding:8px}.resultat>div+div{border-left:1px solid #eadfc2}.resultat b{font:700 18px Georgia,serif;color:#a87a1c}
.formule{font:italic 12px Georgia,serif;color:#555;line-height:1.5;margin:0 0 4px}.delivrance{font:700 12px Arial,sans-serif;color:#14123a;margin:2px 0 6px}
.brevet-main .description{max-width:820px;margin:26px auto 16px;font:400 21px/1.7 Georgia,serif;color:#2a2850;text-align:center}.brevet-main .description b{color:#14123a;font-weight:700}.signatures{display:grid;grid-template-columns:1fr auto 1fr;gap:34px;width:100%;margin-top:auto;align-items:end}.signature-bloc{display:flex;flex-direction:column;align-items:center;gap:5px;padding-top:8px;border-top:2px dotted #14123a}
.signature-bloc span{font:700 9px Arial,sans-serif;letter-spacing:1px;color:#555}.signature-bloc b{font:700 14px Georgia,serif;color:#14123a;min-height:18px}.signature-bloc i{font:10px Arial,sans-serif;color:#888}.signature-bloc.jury{border-color:#14123a}
.rosace{width:84px;height:100px}.rosace svg{width:100%;height:100%;display:block}
.pied-brevet{font:8px Arial,sans-serif;letter-spacing:1.5px;color:#999;margin-top:10px;padding-right:90px}
@media print{@page{size:A4 landscape;margin:0}html,body{background:#fff!important;margin:0!important;padding:0!important}body>*:not(#zone-brevet):not(#zone-doc){display:none!important}#zone-brevet{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}.ecran-brevet .barre{display:none!important}.brevet{width:297mm;height:210mm;min-height:210mm;margin:0;box-shadow:none;break-inside:avoid}.photo-candidat,.photo-vide{width:30mm;height:35mm}}
@media(max-width:760px){.pose{grid-template-columns:1fr}nav{flex-direction:row;overflow:auto;border-right:0;border-bottom:1px solid var(--bord)}nav button{white-space:nowrap}main{padding:14px}}

/* --- Finition professionnelle WEBSERVICES ACADEMY --- */
:root{--bg:#0a1020;--carte:#111b2d;--carte2:#192741;--bord:#2b3b58;--txt:#edf2fb;--doux:#a8b5ca;--or:#e8b85b;--ok:#48c995;--mal:#ff7777;--bleu:#65aaff}
body{background:radial-gradient(ellipse at 12% -10%,#1a3152 0,transparent 38%),var(--bg);letter-spacing:.01em}

.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#f3d18a,#d99a34);box-shadow:0 5px 16px #e8b85b30;font-size:15px}
.haut h1{font-size:16px;letter-spacing:.075em;font-weight:800}.haut small{display:block;margin-top:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.moi{font-size:12px;line-height:1.55}.moi b{font-size:13px;color:#fff}
.pose{grid-template-columns:248px minmax(0,1fr);min-height:calc(100vh - 72px)}
nav{padding:22px 13px;background:rgba(8,16,30,.58);border-right:1px solid #263651;gap:6px}

nav button{position:relative;min-height:43px;padding:10px 13px;border:1px solid transparent;border-radius:11px;font-size:13px;transition:background .18s,border-color .18s,transform .18s}
nav button span{width:22px;text-align:center;font-size:16px}
nav button:hover{background:#17243a;border-color:#2a3b58;transform:translateX(2px)}

main{max-width:1440px;padding:clamp(18px,3vw,38px);margin:0 auto}
h2{font-size:clamp(22px,2.1vw,29px);letter-spacing:-.025em;font-weight:750}
.sous{max-width:760px;color:#aab8cd;font-size:13px;margin:4px 0 22px}
.carte{position:relative;background:linear-gradient(145deg,rgba(21,33,54,.98),rgba(16,26,44,.98));border:1px solid #2b3d5b;border-radius:16px;padding:19px;margin-bottom:16px;box-shadow:0 10px 28px #00000018}
.carte h3{font-size:15px;letter-spacing:.01em}.meta{color:#a5b3c9}

input,select,textarea{min-height:42px;background:#0c1628;border-color:#30415e}

table{font-size:13px}th{font-size:10px;letter-spacing:.09em;color:#aab8cd}td{padding:11px 10px}

.puce{font-weight:650;letter-spacing:.015em}

/* Thèmes dynamiques : système / clair / sombre */
:root{
  color-scheme:dark;
  --bg:#080d12;--carte:#101a19;--carte2:#172925;--bord:#29453c;
  --txt:#edf7f1;--doux:#a5b9ae;--or:#35c987;--ok:#35c987;
  --mal:#ff7777;--bleu:#4d9fff;--fond:#0b1712;
  --entete:#07130e;--nav:#08150f;--surface-alt:#14251e;
  --carte-debut:#12221b;--carte-fin:#0d1915;--champ:#0b1712;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f2f7f4;--carte:#ffffff;--carte2:#e5f3eb;--bord:#c9ded1;
  --txt:#172820;--doux:#5e7468;--or:#138653;--ok:#138653;
  --mal:#c83d4d;--bleu:#176fc1;--fond:#f7fbf8;
  --entete:#ffffff;--nav:#edf5f0;--surface-alt:#e4f1e9;
  --carte-debut:#ffffff;--carte-fin:#f5faf7;--champ:#ffffff;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]):not([data-theme="light"]){
    color-scheme:light;
    --bg:#f2f7f4;--carte:#ffffff;--carte2:#e5f3eb;--bord:#c9ded1;
    --txt:#172820;--doux:#5e7468;--or:#138653;--ok:#138653;
    --mal:#c83d4d;--bleu:#176fc1;--fond:#f7fbf8;
    --entete:#ffffff;--nav:#edf5f0;--surface-alt:#e4f1e9;
    --carte-debut:#ffffff;--carte-fin:#f5faf7;--champ:#ffffff;
  }
}
body{background:radial-gradient(ellipse at 12% -10%,color-mix(in srgb,var(--ok) 13%,transparent) 0,transparent 40%),var(--bg);color:var(--txt)}
.haut{background:var(--entete);border-bottom-color:var(--bord)}
.haut .meta,.moi .meta{color:var(--doux)}
.moi b{color:var(--txt)}
nav{background:var(--nav);border-color:var(--bord)}
nav button{color:var(--doux)}
nav button:hover{background:var(--surface-alt);border-color:var(--bord)}
nav button.actif{background:var(--carte2);border-color:var(--ok);color:var(--ok);box-shadow:inset 3px 0 var(--ok)}
.carte,.brevet-wizard{background:linear-gradient(145deg,var(--carte-debut),var(--carte-fin));border-color:var(--bord);color:var(--txt)}
.meta,.sous,.vide,th{color:var(--doux)}
.btn{background:var(--carte2);border-color:var(--bord);color:var(--txt)}
.btn:hover{border-color:var(--ok)}
.btn.pri{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 75%,white),var(--ok));color:#062016;border-color:var(--ok)}
input,select,textarea,.brevet-champs input,.brevet-champs select{background:var(--champ);border-color:var(--bord);color:var(--txt)}
input::placeholder,textarea::placeholder{color:var(--doux)}
input:focus,select:focus,textarea:focus,:focus-visible{outline-color:var(--ok);border-color:var(--ok)}
th,td{border-bottom-color:var(--bord)}
.puce{border-color:var(--bord);color:var(--doux)}
.brevet-tab{background:var(--champ);border-color:var(--bord);color:var(--txt)}
.brevet-tab.active{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 10%,var(--carte))}
.brevet-navigation{background:color-mix(in srgb,var(--carte) 94%,transparent)}
.theme-toggle{white-space:nowrap;font-weight:750;border-color:var(--ok);color:var(--ok);min-width:94px}
.ecran-brevet{background:color-mix(in srgb,var(--bg) 94%,transparent)}
/* Le diplôme imprimé conserve volontairement son papier blanc et ses couleurs officielles. */
@media(max-width:600px){.theme-toggle{min-width:0;padding:6px 8px;font-size:10px}}


/* Graphiques du tableau de bord Academy */
.graph-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:12px;margin:12px 0}
.academy-graph{min-width:0;overflow:hidden}
.graph-bars{height:190px;display:flex;align-items:flex-end;gap:clamp(5px,2vw,14px);padding:18px 8px 4px;border-bottom:1px solid var(--bord);overflow-x:auto}
.graph-col{flex:1 0 28px;min-width:28px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px}
.graph-value{font-size:11px;color:var(--txt);white-space:nowrap}
.graph-track{height:125px;width:min(100%,34px);display:flex;align-items:flex-end;background:var(--surface-alt);border-radius:8px 8px 3px 3px;overflow:hidden}
.graph-fill{width:100%;min-height:0;border-radius:7px 7px 2px 2px;transition:height .25s ease}
.graph-label{font-size:11px;color:var(--doux);max-width:72px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}


/* =========================================================
   WEBSERVICES ACADEMY — refonte visuelle complète
   Interface inspirée des consoles SaaS / ERP académiques.
   Portée limitée à l'espace connecté : écran de connexion
   et styles d'impression du brevet préservés.
   ========================================================= */
#app:has(> .haut){
  --bg:#f4f5f8;--carte:#fff;--carte2:#f7f4eb;--bord:#e5dfcf;
  --txt:#17213d;--doux:#697187;--ok:#c6a04b;--or:#c6a04b;

  --ombre-forte:0 16px 44px rgba(20,32,68,.13);
  color:var(--txt);
}
:root[data-theme="dark"] #app:has(> .haut){
  --bg:#0b1226;--carte:#121d38;--carte2:#1a2949;--bord:#2d3a5a;
  --txt:#f7f8fc;--doux:#b5bdd0;--ok:#d6b45e;--or:#d6b45e;
  --bleu:#8b9ac2;--fond:#0b1226;--entete:#101a35;--nav:#101a35;
  --surface-alt:#1a2949;--carte-debut:#172341;--carte-fin:#121d38;--champ:#101a35;
  --ombre:0 8px 26px rgba(0,0,0,.22);--ombre-forte:0 16px 44px rgba(0,0,0,.34);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]) #app:has(> .haut){
    --bg:#0b1226;--carte:#121d38;--carte2:#1a2949;--bord:#2d3a5a;
    --txt:#f7f8fc;--doux:#b5bdd0;--ok:#d6b45e;--or:#d6b45e;
    --bleu:#8b9ac2;--fond:#0b1226;--entete:#101a35;--nav:#101a35;
    --surface-alt:#1a2949;--carte-debut:#172341;--carte-fin:#121d38;--champ:#101a35;
    --ombre:0 8px 26px rgba(0,0,0,.16);--ombre-forte:0 16px 44px rgba(0,0,0,.25);
  }
}
body:has(#app > .haut){background:var(--bg);color:var(--txt)}
#app:has(> .haut){min-height:100vh;background:var(--bg)}
#app:has(> .haut) .haut{
  min-height:76px;padding:12px clamp(16px,2.4vw,34px);
  gap:14px;background:var(--entete);border:0;border-bottom:1px solid var(--bord);
  box-shadow:0 3px 16px rgba(20,32,68,.10);backdrop-filter:blur(16px);
  position:sticky;top:0;z-index:30;
}
#app:has(> .haut) .logo{
  width:46px;height:46px;border-radius:14px;flex:0 0 46px;
  color:#142044;background:linear-gradient(145deg,#f0d58d,#b68b35);
  box-shadow:0 5px 14px rgba(198,160,75,.24);font-weight:900;letter-spacing:-.05em;
}
#app:has(> .haut) .haut h1{font-size:15px;font-weight:850;letter-spacing:.095em;color:#fff}
#app:has(> .haut) .haut small{display:block;margin-top:5px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#d4daea}
#app:has(> .haut) .moi{padding:5px 12px;border-left:1px solid var(--bord);text-align:left;line-height:1.35}
#app:has(> .haut) .moi b{font-size:12px;color:#fff}
#app:has(> .haut) .moi .meta{font-size:10px;color:#d4daea}
#app:has(> .haut) .pose{
  display:grid;grid-template-columns:264px minmax(0,1fr);
  min-height:calc(100vh - 76px);align-items:stretch;
}
#app:has(> .haut) nav{
  position:sticky;top:76px;align-self:start;height:calc(100vh - 76px);
  overflow-y:auto;overflow-x:hidden;padding:24px 14px 28px;
  display:flex;flex-direction:column;gap:5px;background:var(--nav);
  border:0;border-right:1px solid var(--bord);
}
#app:has(> .haut) nav:before{
  content:"MENU PRINCIPAL";display:block;padding:0 12px 12px;
  color:var(--doux);font-size:9px;font-weight:850;letter-spacing:.17em;
}
#app:has(> .haut) nav button{
  min-height:44px;width:100%;padding:10px 12px;gap:12px;
  border:1px solid transparent;border-radius:10px;background:transparent;
  color:var(--doux);font-size:12px;font-weight:650;transition:all .18s ease;
}
#app:has(> .haut) nav button span{
  display:grid;place-items:center;width:25px;height:25px;flex:0 0 25px;
  border-radius:8px;background:var(--surface-alt);font-size:14px;
}
#app:has(> .haut) nav button:hover{
  background:var(--surface-alt);border-color:var(--bord);color:var(--txt);transform:translateX(2px);
}
#app:has(> .haut) nav button.actif{
  background:color-mix(in srgb,var(--ok) 10%,var(--carte));
  border-color:color-mix(in srgb,var(--ok) 26%,var(--bord));
  color:var(--bleu);box-shadow:inset 3px 0 var(--ok);font-weight:800;
}
#app:has(> .haut) nav button.actif span{background:var(--ok);color:#17213d}
#app:has(> .haut) main{
  width:100%;max-width:1600px;margin:0 auto;padding:clamp(22px,3vw,42px);
  min-width:0;
}
#app:has(> .haut) main>h2{
  font-size:clamp(24px,2.1vw,31px);line-height:1.2;letter-spacing:-.045em;
  font-weight:850;color:var(--txt);margin:0 0 7px;
}
#app:has(> .haut) main>.sous{
  max-width:850px;margin:0 0 26px;color:var(--doux);font-size:13px;line-height:1.65;
}
#app:has(> .haut) .carte{
  margin-bottom:17px;padding:20px;border:1px solid var(--bord);border-radius:15px;
  background:var(--carte);color:var(--txt);box-shadow:var(--ombre);
}
#app:has(> .haut) .carte h3{font-size:14px;font-weight:800;letter-spacing:-.01em;color:var(--txt)}
#app:has(> .haut) .meta{color:var(--doux)}
#app:has(> .haut) .btn{
  min-height:38px;padding:8px 13px;border:1px solid var(--bord);
  border-radius:9px;background:var(--carte2);color:var(--txt);
  font-size:12px;font-weight:700;box-shadow:none;transition:all .17s ease;
}
#app:has(> .haut) .btn:hover{border-color:var(--ok);filter:brightness(1.04);transform:translateY(-1px)}
#app:has(> .haut) .btn.pri{
  color:#17213d;background:linear-gradient(135deg,#f0d58d,#c6a04b);
  border-color:#c6a04b;box-shadow:0 5px 13px rgba(198,160,75,.22);
}
#app:has(> .haut) .btn.mal{color:var(--mal)}
#app:has(> .haut) .btn.petit{min-height:30px;padding:5px 10px;font-size:11px}
#app:has(> .haut) .theme-toggle{min-width:100px;border-color:color-mix(in srgb,var(--ok) 65%,var(--bord));color:var(--ok);background:var(--surface-alt)}
#app:has(> .haut) form.champs{gap:16px}
#app:has(> .haut) label{gap:7px;color:var(--doux);font-size:11px;font-weight:750;letter-spacing:.025em}
#app:has(> .haut) input,#app:has(> .haut) select,#app:has(> .haut) textarea{
  min-height:42px;padding:10px 12px;border:1px solid var(--bord);border-radius:9px;
  background:var(--champ);color:var(--txt);font-size:13px;transition:border-color .15s,box-shadow .15s;
}
#app:has(> .haut) textarea{min-height:104px}
#app:has(> .haut) input:focus,#app:has(> .haut) select:focus,#app:has(> .haut) textarea:focus{
  outline:0;border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 13%,transparent);
}
#app:has(> .haut) table{font-size:12px;border-collapse:separate;border-spacing:0;overflow:hidden}
#app:has(> .haut) table th{
  padding:12px 13px;background:var(--surface-alt);color:var(--doux);
  font-size:9px;font-weight:850;letter-spacing:.10em;border-bottom:1px solid var(--bord);
}
#app:has(> .haut) table td{padding:12px 13px;border-bottom:1px solid var(--bord);color:var(--txt);line-height:1.5}
#app:has(> .haut) table tr:last-child td{border-bottom:0}
#app:has(> .haut) table tr:hover td{background:color-mix(in srgb,var(--ok) 4%,var(--carte))}
#app:has(> .haut) .puce{padding:4px 9px;border-radius:6px;font-size:10px;font-weight:800;background:var(--surface-alt)}
#app:has(> .haut) .vide{padding:25px 16px;border:1px dashed var(--bord);border-radius:12px;color:var(--doux);background:var(--surface-alt);font-size:12px}
#app:has(> .haut) .graph-grid{gap:16px;margin:16px 0 20px}
#app:has(> .haut) .academy-graph{padding:20px}
#app:has(> .haut) .graph-bars{border-color:var(--bord)}
#app:has(> .haut) .graph-track{background:var(--surface-alt)}
#app:has(> .haut) .brevet-wizard{padding:22px;border-radius:16px;background:var(--carte);border-color:var(--bord);box-shadow:var(--ombre)}
#app:has(> .haut) .brevet-tab{background:var(--surface-alt);border-color:var(--bord);border-radius:10px;font-size:11px}
#app:has(> .haut) .brevet-tab.active{border-color:var(--bleu);background:color-mix(in srgb,var(--bleu) 9%,var(--carte))}
#app:has(> .haut) .brevet-navigation{background:var(--carte);border-color:var(--bord)}
#app:has(> .haut) dialog{background:var(--carte);color:var(--txt);border-color:var(--bord);border-radius:16px;box-shadow:var(--ombre-forte)}
#app:has(> .haut) :focus-visible{outline:2px solid var(--ok);outline-offset:3px}
@media(max-width:1050px){
  #app:has(> .haut) .pose{grid-template-columns:220px minmax(0,1fr)}
  #app:has(> .haut) nav{padding-inline:10px}
  #app:has(> .haut) main{padding:24px 20px}
}
@media(max-width:760px){
  #app:has(> .haut) .haut{min-height:66px;padding:9px 12px;gap:8px}
  #app:has(> .haut) .logo{width:38px;height:38px;flex-basis:38px}
  #app:has(> .haut) .haut h1{font-size:11px;letter-spacing:.045em}
  #app:has(> .haut) .haut small{font-size:8px;letter-spacing:.06em}
  #app:has(> .haut) .moi{padding:3px 7px}

  #app:has(> .haut) .pose{display:flex;flex-direction:column;min-height:calc(100vh - 66px)}
  #app:has(> .haut) nav{
    position:sticky;top:66px;z-index:20;height:auto;max-height:none;
    flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:8px 10px;
    border:0;border-bottom:1px solid var(--bord);gap:5px;
  }
  #app:has(> .haut) nav:before{display:none}
  #app:has(> .haut) nav button{width:auto;flex:0 0 auto;min-height:38px;padding:7px 10px;white-space:nowrap}
  #app:has(> .haut) nav button span{width:21px;height:21px;flex-basis:21px}
  #app:has(> .haut) nav button:hover{transform:none}
  #app:has(> .haut) main{padding:20px 13px}
  #app:has(> .haut) .carte{padding:15px;margin-bottom:13px}

@media(max-width:430px){
  #app:has(> .haut) .moi{display:none}
  #app:has(> .haut) .haut>.btn{padding:6px 8px;font-size:10px}
  #app:has(> .haut) main{padding:17px 10px}
  #app:has(> .haut) .brevet-tabs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(prefers-reduced-motion:reduce){
  #app:has(> .haut) *,#app:has(> .haut) *:before,#app:has(> .haut) *:after{transition:none!important;animation:none!important}
}

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, createUserWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, deleteDoc, query, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig, reglages } from "./config.js";

const DIRECTION_EMAIL = String(reglages.allowedGoogleEmail || "").toLowerCase();
const ROLES = { direction: "Direction", enseignant: "Enseignant", eleve: "Élève", comptable: "Comptable", secretaire: "Secrétaire" };
const STAFF = ["direction", "enseignant", "secretaire", "comptable"];

// Application nommée : la session de la classe reste séparée de celle de MY WORLD RS.
const app = initializeApp(firebaseConfig, "classroom");
const auth = getAuth(app);
const db = getFirestore(app);

// ---------- petits outils ----------
const $app = document.getElementById("app");
const dlg = document.getElementById("dlg");

// Thèmes indépendants de MY WORLD RS : système, clair et sombre.
const THEME_KEY = "webservices-academy-theme";
const THEMES = ["system", "light", "dark"];
let academyTheme = (() => { try { const v = localStorage.getItem(THEME_KEY); return THEMES.includes(v) ? v : "dark"; } catch { return "dark"; } })();
function applyTheme() { document.documentElement.dataset.theme = academyTheme; }
function themeLabel() { return academyTheme === "system" ? "◐ Système" : academyTheme === "light" ? "☀ Clair" : "☾ Sombre"; }
function cycleTheme() {
  academyTheme = THEMES[(THEMES.indexOf(academyTheme) + 1) % THEMES.length];
  try { localStorage.setItem(THEME_KEY, academyTheme); } catch {}
  applyTheme();
  const b = document.querySelector(".theme-toggle");
  if (b) { b.textContent = themeLabel(); b.title = "Changer de thème"; }
}
applyTheme();
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "value") e.value = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
}
const aujourdhui = () => { const d = new Date(); const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return local.toISOString().slice(0, 10); };
const fmtDate = (d) => { if (!d) return ""; const x = new Date(String(d).length <= 10 ? d + "T12:00:00" : d); return isNaN(x) ? String(d) : x.toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); };
const nombre = (v) => Number(String(v).replace(",", "."));
const norm = (s) => String(s || "").trim().toLowerCase();
const tri = (arr, f, desc) => arr.slice().sort((a, b) => (String(f(a)) < String(f(b)) ? -1 : String(f(a)) > String(f(b)) ? 1 : 0) * (desc ? -1 : 1));
const sans = (o) => { const c = { ...o }; delete c.id; return c; };
const aide = (t) => h("p", { class: "meta" }, t);

const monter = (el, ...items) => el.replaceChildren(...items.flat(Infinity).filter((x) => x != null && x !== false));
function fermer() { if (dlg.open) dlg.close(); }
function modal(titre, ...contenu) {
  monter(dlg, h("div", { class: "ligne" }, h("h2", { style: "font-size:19px" }, titre), h("span", { class: "espace" }), h("button", { class: "btn petit", onclick: fermer, type: "button" }, "Fermer")), contenu);
  if (!dlg.open) dlg.showModal();
}

async function lister(nom, ...contraintes) {
  const s = await getDocs(contraintes.length ? query(collection(db, nom), ...contraintes) : collection(db, nom));
  return s.docs.map((d) => ({ id: d.id, ...d.data() }));
}

// Formulaire généré : champs = [{n, label, type, options, req, val, large, liste}]
async function photoCompressee(file) {
  if (!file) return "";
  if (!file.type || !file.type.startsWith("image/")) throw new Error("Choisissez un fichier image valide.");
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();

// ---------- démarrage ----------
onAuthStateChanged(auth, async (user) => {
  cacheEleves = null; moi = null;
  if (!user) { vueConnexion(); return; }
  $app.replaceChildren(h("p", { class: "vide" }, "Connexion…"));
  try {
    const email = String(user.email || "").toLowerCase();
    const ref = doc(db, "ecole_users", user.uid);
    if (DIRECTION_EMAIL && email === DIRECTION_EMAIL && user.emailVerified !== false) {
      const s = await getDoc(ref);
      moi = { uid: user.uid, nom: (s.exists() && s.data().nom) || user.displayName || "Direction", email, role: "direction", classe: "" };
      if (!s.exists()) await setDoc(ref, { nom: moi.nom, email, role: "direction", classe: "", actif: true, cree: new Date().toISOString() });
    } else {
      const s = await getDoc(ref);
      if (!s.exists() || s.data().actif === false) { await signOut(auth); vueConnexion("Ce compte n'est pas (ou plus) activé pour la classe. Contactez le secrétariat."); return; }
      const d = s.data(); moi = { uid: user.uid, nom: d.nom || email, email, role: d.role, classe: d.classe || "" };
    }
    if (!ROLES[moi.role]) { await signOut(auth); vueConnexion("Rôle inconnu pour ce compte."); return; }
    vueCourante = "accueil"; vueApp();
  } catch (e) { await signOut(auth).catch(() => {}); vueConnexion(erreurTexte(e)); }
});
